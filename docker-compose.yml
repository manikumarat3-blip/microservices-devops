services:
  user-service:
    build:
      context: ./user-service
    image: user-service:1.0.0
    container_name: user-service
    restart: unless-stopped
    environment:
      SERVICE_NAME: user-service
      SERVICE_PORT: 8001
    ports:
      - "8001:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - microservices-network

  product-service:
    build:
      context: ./product-service
    image: product-service:1.0.0
    container_name: product-service
    restart: unless-stopped
    environment:
      SERVICE_NAME: product-service
      SERVICE_PORT: 8002
    ports:
      - "8002:8002"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - microservices-network

  order-service:
    build:
      context: ./order-service
    image: order-service:1.0.0
    container_name: order-service
    restart: unless-stopped
    environment:
      SERVICE_NAME: order-service
      SERVICE_PORT: 8003
      USER_SERVICE_URL: http://user-service:8001
      PRODUCT_SERVICE_URL: http://product-service:8002
    ports:
      - "8003:8003"
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - microservices-network

  nginx:
    image: nginx:alpine
    container_name: microservices-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge

volumes:
  application-data:

