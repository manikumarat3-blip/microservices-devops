services:

  user-service:
    image: ${USER_IMAGE:?USER_IMAGE is required}

    container_name: user-service

    environment:
      SERVICE_NAME: user-service
      SERVICE_PORT: "8001"

    ports:
      - "8001:8001"

    networks:
      - microservices-network

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  product-service:
    image: ${PRODUCT_IMAGE:?PRODUCT_IMAGE is required}

    container_name: product-service

    environment:
      SERVICE_NAME: product-service
      SERVICE_PORT: "8002"

    ports:
      - "8002:8002"

    networks:
      - microservices-network

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  order-service:
    image: ${ORDER_IMAGE:?ORDER_IMAGE is required}

    container_name: order-service

    environment:
      SERVICE_NAME: order-service
      SERVICE_PORT: "8003"

      USER_SERVICE_URL: http://user-service:8001
      PRODUCT_SERVICE_URL: http://product-service:8002

    ports:
      - "8003:8003"

    networks:
      - microservices-network

    depends_on:
      user-service:
        condition: service_healthy

      product-service:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  nginx:
    image: nginx:alpine

    container_name: microservices-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      user-service:
        condition: service_healthy

      product-service:
        condition: service_healthy

      order-service:
        condition: service_healthy

    networks:
      - microservices-network

    restart: unless-stopped


networks:
  microservices-network:
    driver: bridge

