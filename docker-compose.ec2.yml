services:

  user-service:
    image: ${USER_IMAGE}
    container_name: user-service
    restart: unless-stopped
    environment:
      SERVICE_NAME: user-service
    expose:
      - "8001"
    networks:
      - microservices-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  product-service:
    image: ${PRODUCT_IMAGE}
    container_name: product-service
    restart: unless-stopped
    environment:
      SERVICE_NAME: product-service
    expose:
      - "8002"
    networks:
      - microservices-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  order-service:
    image: ${ORDER_IMAGE}
    container_name: order-service
    restart: unless-stopped
    environment:
      SERVICE_NAME: order-service
    expose:
      - "8003"
    networks:
      - microservices-network
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: microservices-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge

